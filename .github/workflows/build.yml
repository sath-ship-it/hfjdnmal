name: Veröffentlichen und APK bauen

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# Zwei Deploys gleichzeitig würden sich überholen.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # Muss zu server.url in capacitor.config.json passen, sonst zeigt die
  # APK auf eine andere Stelle als die, die hier veröffentlicht wird.
  CF_PROJEKT: flux-baustelle

jobs:
  # ── Die Web-App: der Teil, der sich selbst aktualisiert ──
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Hooks hinter einer fruehen Rueckgabe sieht man dem Code an, nicht
      # dem Bild: der Rauchtest kommt nie ueber den Anmeldebildschirm
      # hinaus und bliebe gruen, waehrend die App nach der Anmeldung
      # schwarz ist. Deshalb hier, vor allem anderen.
      - name: Hook-Regeln pruefen
        run: npm run pruefen

      - name: Bauen
        # Cloudflare Pages liefert im Wurzelverzeichnis aus, daher "/".
        # Die Fassung steht danach in der App unter "Mehr".
        run: BASE_PATH=/ FLUX_FASSUNG=1.1.${{ github.run_number }} npm run build

      - name: Prüfen, ob der Service Worker gebaut wurde
        # Ohne sw.js gäbe es keine Selbst-Aktualisierung — das darf nicht
        # unbemerkt durchrutschen.
        run: test -f dist/sw.js && test -f dist/manifest.webmanifest

      - uses: actions/upload-artifact@v4
        with:
          name: flux-web
          path: dist
          if-no-files-found: error

  # ── Veröffentlichen auf Cloudflare Pages ──
  cloudflare:
    # Auch auf die Huelle warten: die APK wird mitveroeffentlicht, damit
    # /flux.apk immer zur ausgelieferten Fassung passt.
    needs: [web, apk]
    # Nur der Standard-Zweig geht live. Ohne hinterlegtes Token wird der
    # Schritt übersprungen statt rot zu laufen.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flux-web
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: flux-apk
          path: huelle
      - name: APK zur Webseite legen
        run: mv huelle/app-debug.apk dist/flux.apk

      - name: Zugangsdaten vorhanden?
        id: pruefung
        env:
          # Über env statt direkt in die Kommandozeile — sonst stünde das
          # Token im Klartext im Shell-Aufruf.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=ja" >> "$GITHUB_OUTPUT"
          else
            echo "ok=nein" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN oder CLOUDFLARE_ACCOUNT_ID fehlt — nicht veröffentlicht."
          fi

      - name: Projekt anlegen, falls es noch nicht existiert
        if: steps.pruefung.outputs.ok == 'ja'
        continue-on-error: true   # existiert es bereits, ist das kein Fehler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages project create "$CF_PROJEKT" \
            --production-branch "${{ github.event.repository.default_branch }}"

      - name: Veröffentlichen
        if: steps.pruefung.outputs.ok == 'ja'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages deploy dist \
            --project-name "$CF_PROJEKT" \
            --branch "${{ github.event.repository.default_branch }}" \
            --commit-dirty=true

  # ── Die Hülle: ändert sich selten, muss von Hand installiert werden ──
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - run: npm ci
      # Die Web-Icons macht "npm run build" selbst; die Android-Icons
      # brauchen das Projekt aus "cap add" und laufen deshalb getrennt.
      - name: Web-Teil bauen
        run: BASE_PATH=/ FLUX_FASSUNG=1.1.${{ github.run_number }} npm run build
      - name: Android-Icons erzeugen
        run: node tools/make-android-icons.mjs
      - name: Nach Android übertragen
        run: npx cap sync android

      # Liegt ein Signaturschlüssel als Secret bereit, wird die Hülle
      # signiert gebaut. Ohne ihn bleibt es beim Debug-Bau — das ist zum
      # Ausprobieren völlig ausreichend und läuft ohne Zutun weiter.
      - name: Schlüssel auspacken, falls vorhanden
        id: schluessel
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p "$RUNNER_TEMP/schluessel"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/schluessel/flux.jks"
            echo "pfad=$RUNNER_TEMP/schluessel/flux.jks" >> "$GITHUB_OUTPUT"
            echo "da=ja" >> "$GITHUB_OUTPUT"
          else
            echo "da=nein" >> "$GITHUB_OUTPUT"
            echo "::notice::Kein FLUX_KEYSTORE_BASE64 — die APK wird unsigniert (Debug) gebaut."
          fi

      - name: APK bauen
        working-directory: android
        env:
          # Steigende Nummer, sonst verweigert Android das Überinstallieren.
          FLUX_VERSION_CODE: ${{ github.run_number }}
          FLUX_VERSION_NAME: 1.1.${{ github.run_number }}
          FLUX_KEYSTORE: ${{ steps.schluessel.outputs.pfad }}
          FLUX_KEYSTORE_PASSWORT: ${{ secrets.FLUX_KEYSTORE_PASSWORT }}
          FLUX_SCHLUESSEL: ${{ secrets.FLUX_SCHLUESSEL }}
          FLUX_SCHLUESSEL_PASSWORT: ${{ secrets.FLUX_SCHLUESSEL_PASSWORT }}
        run: |
          if [ "${{ steps.schluessel.outputs.da }}" = "ja" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      # Egal welcher Weg: das Ergebnis heisst immer gleich, damit die
      # Veröffentlichung nichts davon wissen muss.
      - name: Ergebnis einsammeln
        run: |
          mkdir -p huelle
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk huelle/app-debug.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk huelle/app-debug.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: flux-apk
          path: huelle/app-debug.apk
          if-no-files-found: error
